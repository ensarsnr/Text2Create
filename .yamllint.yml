extends: default

ignore: |
  node_modules/
  target/
  dist/

rules:
  document-start: disable
  line-length:
    max: 160
  truthy:
    # GitHub Actions uses "on" as a key.
    check-keys: false
  comments:
    # Dependabot writes version comments after pinned SHAs with a single space.
    min-spaces-from-content: 1
