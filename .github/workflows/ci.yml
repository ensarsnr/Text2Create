name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default to no permissions; each job requests only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check required files, internal links, and forbidden files
        run: python3 scripts/check_repository.py

  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          globs: "**/*.md"

  yaml:
    name: YAML lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install yamllint
        run: |
          python3 -m venv "$RUNNER_TEMP/yamllint"
          "$RUNNER_TEMP/yamllint/bin/pip" install --disable-pip-version-check yamllint==1.38.0
      - name: Lint YAML files
        run: '"$RUNNER_TEMP/yamllint/bin/yamllint" --strict .'

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (install scripts disabled via .npmrc)
        run: npm ci
      - name: Verify registry signatures
        run: npm audit signatures
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  desktop:
    name: Desktop app (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (install scripts disabled via .npmrc)
        run: npm ci
      - name: Build frontend (required by tauri::generate_context!)
        run: npm run build
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache Cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run tests
        working-directory: src-tauri
        run: cargo test --locked --workspace
      - name: Verify the Project IR crate does not depend on Tauri
        working-directory: src-tauri
        run: |
          if cargo tree --locked -p text2create-ir -e normal,build,dev --prefix none --format '{p}' | awk '{print $1}' | grep -i tauri; then
            echo "::error::text2create-ir must not depend on Tauri (ADR-0014)"
            exit 1
          fi
      - name: Build application bundle
        run: npm run tauri -- build --bundles app --ci
      - name: Verify bundle architecture
        run: |
          APP=src-tauri/target/release/bundle/macos/Text2Create.app
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -u+x | head -n 1)
          test -n "$BIN"
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -qx arm64
