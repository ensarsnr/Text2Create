[package]
name = "text2create"
version = "0.1.0"
description = "Text2Create desktop application"
authors = ["The Text2Create Contributors"]
license = "Apache-2.0"
repository = "https://github.com/ensarsnr/Text2Create"
publish = false
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["crates/text2create-ir", "crates/text2create-store"]

[lib]
name = "text2create_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
text2create-ir = { path = "crates/text2create-ir" }
text2create-store = { path = "crates/text2create-store" }

[dev-dependencies]
serde_json = "1.0.154"
