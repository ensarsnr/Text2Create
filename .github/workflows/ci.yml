name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default to no permissions; each job requests only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check required files, internal links, and forbidden files
        run: python3 scripts/check_repository.py

  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  yaml:
    name: YAML lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install yamllint
        run: |
          python3 -m venv "$RUNNER_TEMP/yamllint"
          "$RUNNER_TEMP/yamllint/bin/pip" install --disable-pip-version-check yamllint==1.38.0
      - name: Lint YAML files
        run: '"$RUNNER_TEMP/yamllint/bin/yamllint" --strict .'
