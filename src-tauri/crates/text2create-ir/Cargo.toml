[package]
name = "text2create-ir"
version = "0.1.0"
description = "Project IR v1 data model, strict loading, and canonical serialization for Text2Create"
authors = ["The Text2Create Contributors"]
license = "Apache-2.0"
repository = "https://github.com/ensarsnr/Text2Create"
publish = false
edition = "2024"
rust-version = "1.90"

# This crate must not depend on Tauri (ADR-0014). CI verifies this.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing"] }
uuid = { version = "1.29.3", features = ["v7"] }
